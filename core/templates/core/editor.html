{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/editor.css' %} ">
{% endblock %}

<section class="box full-height">
    <div class="columns">
        <div class="column">
            <p class="control">
                <span class="select is-large is-fullwidth">
                    <select id="language-select" name="language">
                        <option {% if last_submission.language == 'null' %}selected{% endif %} value="null">
                            Escolha uma Linguagem
                        </option>
                        <option {% if last_submission.language == 'c' %}selected{% endif %} value="c">
                            C
                        </option>
                        <option {% if last_submission.language == 'cplusplus' %}selected{% endif %} value="cplusplus">
                            C++
                        </option>
                        <option {% if last_submission.language == 'javascript' %}selected{% endif %} value="javascript">
                            JavaScript
                        </option>
                        <option {% if last_submission.language == 'java' %}selected {% endif %} value="java">
                            Java
                        </option>
                        <option {% if last_submission.language == 'python' %}selected {% endif %} value="python">
                            Python
                        </option>
                        <option {% if last_submission.language == 'pythonwasm' %}selected {% endif %} value="pythonwasm">
                            Python WASM
                        </option>
                    </select>
                </span>
            </p>
        </div>
        <div class="column">
            <div class="field has-addons has-addons-centered">
                <p class="control">
                    <button id="run-button" class="button is-primary is-large">
                        <span></span>
                        <span class="icon">
                            <i class="fa fa-play"></i>
                        </span>
                        <span></span>
                    </button>
                </p>
                <p class="control">
                    <button id="copy-button" class="button is-large" type="button" data-clipboard-action="copy"
                        aria-label="Copiar">
                        <span></span>
                        <span class="icon">
                            <i class="fa fa-copy"></i>
                        </span>
                        <span></span>
                    </button>
                </p>
                <p class="control">
                    <button id="undo-button" class="button is-large" type="button" aria-label="Desfazer">
                        <span></span>
                        <span class="icon">
                            <i class="fa fa-undo"></i>
                        </span>
                        <span></span>
                    </button>
                </p>
            </div>
        </div>
        <div class="column">
            <div class="field has-addons">
                <p class="control is-expanded">
                    <input id="filename" class="input is-large" type="text" placeholder="filename"
                        value="{{last_submission.name}}">
                </p>
                <p class="control">
                    <button id="save-button" class="button is-success is-large" type="button" aria-label="Salvar">
                        <span></span>
                        <span class="icon">
                            <i class="fa fa-save"></i>
                        </span>
                        <span class="is-hidden-mobile">Salvar</span>
                    </button>
                </p>
            </div>
        </div>
        <hr class="is-hidden-mobile">
    </div>
    <textarea name="editor" id="editor" rows="2">{% if last_submission %}{{last_submission.code}}{% endif %}</textarea>
</section>

{% block js %}
<script src="{% static 'codemirror/lib/codemirror.js'%}"></script>
<link rel="stylesheet" href="{% static 'codemirror/lib/codemirror.css' %} ">
<link rel="stylesheet" href="{% static 'codemirror/theme/solarized.css' %} ">
<script src="{% static 'codemirror/mode/clike/clike.js'%}"></script>
<script src="{% static 'codemirror/mode/javascript/javascript.js'%}"></script>
<script src="{% static 'codemirror/mode/python/python.js'%}"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.20.0/full/pyodide.js"></script>
<script src="{% static 'js/runner.js'%}"></script>
<script src="{% static 'js/editor.js'%}"></script>
{% endblock %}
