<div class="navbar-item has-dropdown is-hoverable">
  <a class="navbar-link"><ion-icon name="planet"></ion-icon>&nbsp; SendIT-Verso</a>

  <div class="navbar-dropdown">
    <a class="navbar-item" href="https://www.youtube.com/c/dannluciano"><ion-icon name="logo-youtube"></ion-icon>&nbsp;Canal no Youtube</a>
    <hr class="navbar-divider" />
    {% if 'projects' in request.resolver_match.app_names %}
      <a class="navbar-item" href="{% url 'core:home' %}"><ion-icon name="send"></ion-icon>&nbsp;SendIT</a>
    {% else %}
      <a class="navbar-item" href="{% url 'projects:home' %}"><ion-icon name="hammer"></ion-icon>&nbsp;SendIT-IDE</a>
    {% endif %}
  </div>
</div>

{% if request.user.is_staff %}
  <a class="navbar-item is-tab" href="{% url 'admin:index' %}"><ion-icon name="storefront"></ion-icon>&nbsp;Administração</a>
{% endif %}

<div class="navbar-item">
  <button class="button" onclick="darkxlight()">🌓 Dark/Light</button>
</div>

<form action="{% url 'core:logout' %}" method="post" class="navbar-item">
  {% csrf_token %}
  <input type="hidden" name="sair" />
  <button class="button is-danger is-outlined">Sair</button>
</form>
