{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="{% static 'vendor/bulma/css/bulma.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <title>Login</title>
  </head>

  <body>
    <header>
      <nav class="nav has-shadow menu-cima navbar theme" role="navigation" aria-label="main navigation">
        <div class="navbar-menu">
          <div class="navbar-end">
            <div class="navbar-item">
              <button class="button" onclick="darkxlight()">🌓 Dark/Light</button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <section class="main hero is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns">
            <div class="column is-8 is-offset-2">
              <div class="card">
                <div class="card-content">
                  <div class="content">
                    <p class="title has-text-centered">Entrar no SendIT</p>
                    {% block content %}
                      {% if form.errors %}
                        <article class="message is-danger is-large">
                          <div class="message-header">Erro de Autenticação</div>
                          <div class="message-body">
                            <p>Nome de Usuário e/ou Senha incorretos!</p>
                            <p>
                              Esqueceu a senha? &nbsp;
                              <a href="{% url 'password_reset' %}">Mudar Senha</a>
                            </p>
                          </div>
                        </article>
                      {% endif %}

                      <form method="post" action="{% url 'core:index' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}" />
                        <div class="field">
                          <label class="label has-text-centered">Usuário:</label>
                          <div class="control">
                            <input class="input is-large" type="text" placeholder="Seu usuário" name="username" />
                          </div>
                        </div>
                        <div class="field">
                          <label class="label has-text-centered">Senha:</label>
                          <div class="control">
                            <input class="input is-large" type="password" placeholder="Sua senha" name="password" />
                          </div>
                        </div>
                        <p class="control has-text-centered">
                          <button class="button is-large is-success is-fullwidth">Login</button>
                        </p>
                        <br />
                        <br />
                        <div class="columns">
                          <div class="column">
                            <div class="columns is-vcentered">
                              Novo(a) por aqui? &nbsp;
                              <a class="button is-info is-light" href="{% url 'core:signup' %}">Cadastre-se</a>
                            </div>
                          </div>
                          <div class="column">
                            <div class="columns is-vcentered">
                              Esqueceu a senha? &nbsp;
                              <a class="button is-warning is-light" href="{% url 'password_reset' %}">Mudar Senha</a>
                            </div>
                          </div>
                        </div>
                        <br />
                      </form>
                    {% endblock %}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bulma.js' %}"></script>
  </body>
</html>
