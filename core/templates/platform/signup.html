{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <title>Cadastro de usuário</title>
</head>
<body>
    <section class="hero is-fullheight bg-color-laranja">
        <div class="hero-body">
            <div class="container">
                <div class="columns">
                    <div class="column is-4 is-offset-4">
                        <div class="card">
                            <div class="card-content">
                                <div class="content">
                                    <p class="title has-text-centered">Cadastro</p>
                                    <form method="post">
                                    {% csrf_token %}
                                    {% for field in form %}
                                        {% for error in field.errors %}
                                        <p class="control" style="color: red">{{ error }}</p>
                                        {% endfor %}
                                    {% endfor %}
                                    <div class="field">
                                        <label class="label has-text-centered">Usuário:</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Seu usuário" name="username" required>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label has-text-centered">Nome:</label>
                                        <div class="control">
                                            <input class="input" maxlength="30" type="text" placeholder="Digite seu nome" name="first_name" required>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label has-text-centered">Sobrenome:</label>
                                        <div class="control">
                                            <input class="input" maxlength="30" type="text" placeholder="Digite seu sobrenome" name="last_name" required>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label has-text-centered">Email:</label>
                                        <div class="control">
                                            <input class="input" maxlength="254" type="email" placeholder="Digite seu email" name="email" required>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label has-text-centered">Senha:</label>
                                        <div class="control">
                                            <input class="input" type="password" placeholder="Sua senha" name="password1" required>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label has-text-centered">Confirmação de senha:</label>
                                        <div class="control">
                                            <input class="input" type="password" placeholder="Repita sua senha" name="password2" required>
                                        </div>
                                    </div>
                                    <p class="control has-text-centered">
                                        <button class="button is-info">Cadastrar</button>
                                    </p>
                                    <input type="hidden" name="next" value="{{ next }}">
                                    </form>                             
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script data-goatcounter="https://dlanalytics.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
