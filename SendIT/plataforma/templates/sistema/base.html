{% load staticfiles %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css?family=Gochi+Hand" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/font-awesome-4.7.0/css/font-awesome.min.css' %}">
</head>
<body>
<nav class="nav menu-cima">
    <div class="nav-left">
        <a class="nav-item" href="/home/" id="nome-projeto">Send<span>IT</span></a>
    </div>
    <div class="nav-center">
        <div class="nav-item menu-executar">
            <button id="botao-executar" class="button is-outlined botao-executar is-medium">
                <span class="icon is-medium">
                    <i class="fa fa-play play-executar"></i>
                </span>
            </button>
        </div>
    </div>
    <span class="nav-toggle" id="nav-toggle">
      <span></span>
      <span></span>
      <span></span>
    </span>
    <div class="nav-right nav-menu" id="nav-menu">
        <a class="nav-item">
            Home
        </a>
        <a class="nav-item">
            Documentation
        </a>
        <a class="nav-item">
            Blog
        </a>
        <a class="nav-item" href="/admin/">
            Admin
        </a>
        <form action="/sair/" method="post">
          {% csrf_token %}
          <input type="hidden" name="sair">
          <button class="button is-danger is-inverted botao-sair">Sair</button>
        </form>
    </div>
</nav>
{% block content %}
{% endblock %}
{% block footer %}
{% endblock %}
<script src="{% static 'js/jquery-2.2.0.min.js' %}"></script>
<script src="{% static 'js/clipboard.min.js' %}"></script>
<script src="{% static 'js/bulma.js' %}"></script>
{% block js %}
{% endblock js %}
</body>
</html>
