{% load staticfiles %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css?family=Gochi+Hand" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/font-awesome-4.7.0/css/font-awesome.min.css' %}">
</head>
<body>
<nav class="nav menu-cima">
    <div class="nav-left">
        <a class="nav-item" href="/" id="nome-projeto">Send<span>IT</span></a>
    </div>
    <div class="nav-center">
        <div class="nav-item menu-executar">
            <button id="botao-executar" class="button is-outlined botao-executar is-medium">
                <span class="icon is-medium">
                    <i class="fa fa-play play-executar"></i>
                </span>
            </button>
        </div>
    </div>
    <span class="nav-toggle" id="nav-toggle">
      <span></span>
      <span></span>
      <span></span>
    </span>
    <div class="nav-right nav-menu" id="nav-menu">
        <a class="nav-item">
            Home
        </a>
        <a class="nav-item">
            Documentation
        </a>
        <a class="nav-item">
            Blog
        </a>
        <a class="nav-item" href="/admin/">
            Admin
        </a>
    </div>
</nav>
<div class="columns">

    {% block content %}
    {% endblock content %}

</div>
<footer class="footer">
    <div class="container">
        <div class="content has-text-centered">
            <p>
                <strong class="nome-projeto-footer">SendIT</strong> by <a href="http://jgthms.com">Nós 3</a>. The source

                is licensed <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/">CC ANS 4.0</a>.
            </p>
            <p>
                <a class="icon" href="https://github.com/jgthms/bulma">
                    <i class="fa fa-github"></i>
                </a>
            </p>
        </div>
    </div>
</footer>
<script src="{% static 'js/jquery-2.2.0.min.js' %}"></script>
<script src="{% static 'js/clipboard.min.js' %}"></script>
<script src="{% static 'js/bulma.js' %}"></script>
{% block js %}
{% endblock js %}
</body>
</html>
