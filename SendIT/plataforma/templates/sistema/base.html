{% load staticfiles %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css?family=Gochi+Hand" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    {% block css %}
    {% endblock %}
</head>
<body>
<nav class="nav menu-cima">
    <div class="nav-left">
        <a class="nav-item" href="/home/" id="nome-projeto">Send<span>IT</span></a>
    </div>
    <span class="nav-toggle" id="nav-toggle">
        <span></span>
        <span></span>
        <span></span>
    </span>
    <div class="nav-right nav-menu" id="nav-menu">
        <a class="nav-item" href="/home/">
            Home
        </a>
        <a class="nav-item" href="/questoes-concluidas/">
            Questões concluidas
        </a>
        <form action="/sair/" method="post">
          {% csrf_token %}
          <input type="hidden" name="sair">
          <button class="button is-danger is-inverted botao-sair">Sair</button>
        </form>
    </div>
</nav>
<div class="columns">
    {% block menu_lateral %}
    {% endblock %}
    <div class="column">
        {% block content %}
        {% endblock %}
    </div>
</div>
{% block footer %}
{% endblock %}
<script src="{% static 'js/jquery-2.2.0.min.js' %}"></script>
<script src="{% static 'js/clipboard.min.js' %}"></script>
<script src="{% static 'js/bulma.js' %}"></script>
{% block js %}
{% endblock js %}
</body>
</html>
