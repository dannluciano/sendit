{% load staticfiles %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% block title %}{% endblock %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css?family=Gochi+Hand" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    {% block css %}
    {% endblock %}
</head>
<body>
<nav class="nav has-shadow menu-cima">
    <div class="container">
        <div class="nav-left">
            <a class="nav-item is-tab {% if link is 1 %} link-laranja {% endif %}" href="/home/"><i class="fa fa-home"></i> &nbsp; Home</a>
            <a class="nav-item is-tab {% if link is 2 %} link-laranja {% endif %}" href="/questoes-concluidas/"><i class="fa fa-bolt"></i> &nbsp; Questões Concluídas</a>
        </div>
        <span class="nav-toggle" id="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
        </span>

        <div class="nav-right nav-menu" id="nav-menu">
            <form action="/sair/" method="post" class="nav-item">
                {% csrf_token %}
                <input type="hidden" name="sair">
                <button class="button is-danger botao-sair">Sair</button>
            </form>
        </div>
    </div>
</nav>
<section class="section main">
    {% block content %}
    {% endblock %}
    {% block menu_direita %}
    {% endblock %}
</section>
<script src="{% static 'js/jquery-2.2.0.min.js' %}"></script>
<script src="{% static 'js/clipboard.min.js' %}"></script>
<script src="{% static 'js/bulma.js' %}"></script>
{% block js %}
{% endblock js %}
</body>
</html>
