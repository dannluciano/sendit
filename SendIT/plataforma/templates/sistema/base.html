{% load staticfiles %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    {% block title %}{% endblock %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="mask-icon" href="/static/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css?family=Gochi+Hand" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
        integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">
    {% block css %}
    {% endblock %}
</head>

<body>
    <nav class="nav has-shadow menu-cima">

        <div class="nav-left">
            <a class="nav-item is-tab {% if link is 1 %} link-laranja {% endif %}" href="/home/"><i
                    class="fa fa-home"></i> &nbsp; Home</a>
            <a class="nav-item is-tab {% if link is 2 %} link-laranja {% endif %}" href="/questoes-concluidas/"><i
                    class="fa fa-bolt"></i>&nbsp; Questões Concluídas</a>
            <a class="nav-item is-tab {% if link is 3 %} link-laranja {% endif %}" href="/aleatoria/"><i
                    class="fas fa-random"></i>&nbsp; Questão Aleatória</a>
            <a class="nav-item is-tab {% if link is 4 %} link-laranja {% endif %}" href="/pontuacao/"><i
                    class="fas fa-medal"></i>&nbsp; Quadro de Pontos</a>
        </div>
        <span class="nav-toggle" id="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
        </span>

        <div class="nav-right nav-menu" id="nav-menu">
            <a class="nav-item is-tab link-laranja" href="/admin/"><i class="fas fa-user-shield"></i>&nbsp;
                Administração</a>
            <form action="/sair/" method="post" class="nav-item">
                {% csrf_token %}
                <input type="hidden" name="sair">
                <button class="button is-danger botao-sair">Sair</button>
            </form>
        </div>

    </nav>
    <section class="section main">
        {% block content %}
        {% endblock %}
        {% block menu_direita %}
        {% endblock %}
    </section>

    <script src="{% static 'js/jquery-2.2.0.min.js' %}"></script>
    <script src="{% static 'js/clipboard.min.js' %}"></script>
    <script src="{% static 'js/bulma.js' %}"></script>
    {% block js %}
    {% endblock js %}
</body>

</html>
