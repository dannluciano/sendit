{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="{% static 'css/bulma.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <title>Login</title>
</head>
<body>
    <section class="hero is-fullheight bg-color-laranja">
        <div class="hero-body">
            <div class="container">
                <div class="columns">
                    <div class="column is-4 is-offset-4">
                        <div class="card">
                            <div class="card-content">
                                <div class="content">
                                    <p class="title has-text-centered">Login</p>
                                    {% block content %}
                                    <form method="post" action="{% url 'plataforma:index' %}">
                                    {% csrf_token %}
                                    <div class="field">
                                        <label class="label has-text-centered">Usuário:</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Seu usuário" name="username">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label has-text-centered">Senha:</label>
                                        <div class="control">
                                            <input class="input" type="password" placeholder="Sua senha" name="password">
                                        </div>
                                    </div>
                                    <p class="control has-text-centered">
                                        <button class="button is-info">Login</button>
                                    </p>
                                    <p class="control">Novo(a) por aqui? <a href="{% url 'plataforma:cadastrar' %}">Cadastre-se</a></p>
                                    <input type="hidden" name="next" value="{{ next }}">
                                    </form>
                                
                                    {% endblock %}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
