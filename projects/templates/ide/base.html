{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content" />
    <title>SendIT - Projects</title>
    <link rel="stylesheet" href="{% static 'vendor/bulma/css/bulma.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>

  <body>
    <header>
      <nav class="nav has-shadow menu-cima navbar theme" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
          <a class="navbar-item" href="{% url 'projects:home' %}"><ion-icon name="hammer"></ion-icon>&nbsp; SendIT-IDE</a>

          <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </a>
        </div>
        <div class="navbar-menu">
          <div class="navbar-end">
            {% include 'core/sendit-verse.html' %}

            <div class="navbar-item">
              <button class="button" onclick="darkxlight()">🌓 Dark/Light</button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <br />
      <div class="container">
        {% block content %}

        {% endblock %}
      </div>
    </main>
    <script src="{% static 'js/jquery-3.6.4.min.js' %}"></script>
    <script src="{% static 'js/bulma.js' %}"></script>
    <script src="{% static 'vendor/ionicons/ionicons.js' %}"></script>
  </body>
</html>
