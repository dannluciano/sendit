{% extends 'ide/base.html' %}
{% load static %}

{% block content %}
  <main>
    <br />
    <div class="container">
      <article>
        <section class="box">
          <header class="has-text-centered">
            <h1 class="title">Novo Projeto</h1>
          </header>
          <form action="{% url 'projects:project-new' %}" method="post">
            {% csrf_token %}
            <div class="field">
              <label class="label">Nome:</label>
              <div class="control">
                <input class="input is-large" type="text" placeholder="webserver-bolado" name="name" value="{{ form.name.value|default:'' }}" pattern="[A-Za-z0-9_-]+" title="Use apenas letras, numeros, underscore e hifen." />
              </div>
              {% if form.name.errors %}
                <p class="help is-danger">{{ form.name.errors.0 }}</p>
              {% endif %}
            </div>
            <div class="field">
              <div class="buttons">
                <button class="button is-success is-large">Criar novo Projeto</button>
                <button class="button is-warning is-large" type="button" onclick="javascript:window.history.back()">Voltar</button>
              </div>
            </div>
          </form>
        </section>
      </article>
    </div>
  </main>
{% endblock %}
